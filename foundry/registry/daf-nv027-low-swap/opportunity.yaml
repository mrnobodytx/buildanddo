schema_version: foundry.opportunity/v1
lane_id: daf-nv027-low-swap
topic: DAF NV027 Brain-Inspired Low-SWaP — Phase I heterogeneous neural runtime research
requirements:
  - id: NV027-REQ-01
    text: Compare a frozen monolithic baseline with a heterogeneous neural runtime under identical tasks.
    acceptance: Both candidates use the same datasets, splits, seeds, scoring and compute accounting.
    status: open
    evidence_ids: []
  - id: NV027-REQ-02
    text: Evaluate perception, temporal, transformer, spiking and graph or vector memory subsystems behind a dynamic compute gate.
    acceptance: Ablations identify each subsystem, gate decision and active compute path.
    status: open
    evidence_ids: []
  - id: NV027-REQ-03
    text: Establish a scientifically testable contribution rather than relabeling orchestration with biological terms.
    acceptance: The plan states novelty, falsifier, baselines and statistical test before candidate evaluation.
    status: open
    evidence_ids: []
  - id: NV027-REQ-04
    text: Produce a Phase I simulation or small prototype with reproducible resource measurements.
    acceptance: Frozen code, configuration and repeated results reproduce accuracy, latency and resource values.
    status: open
    evidence_ids: []
eligibility:
  - id: NV027-ELIG-01
    criterion: Citadel Nexus Inc. and the proposed team meet the current DAF topic rules.
    status: unverified
  - id: NV027-ELIG-02
