schema_version: foundry.experiment/v1
lane_id: darpa-semantic-isr
dataset: foundry/fixtures/darpa-semantic-isr.json
dataset_sha256: 542f834a96d132082928f904fb9cdb7d9e54ff1e17bc0a295997fe10ca9cfc93
candidates: ["full-scene-json","roi-delta-json"]
seeds: [17, 29, 43]
repetitions: 2
timeout_seconds: 30
requirement_ids: ["ISR-REQ-02","ISR-REQ-03"]
scope: "Synthetic scene annotations with supplied relevance labels and JSON wire encoding; no EO detector, video codec or hardware proof."
purpose: "Compare full-scene transfer with ordered ROI deltas and measure actual receiver recovery and coordinate loss."
primary_metric: byte_ratio
metrics:
  - name: byte_ratio
    unit: "encoded / full-scene bytes"
    direction: lower
  - name: wire_bytes
    unit: "bytes"
    direction: lower
  - name: mission_object_recall
    unit: "recovered / required objects"
    direction: higher
    threshold:
      operator: "=="
      value: 1
  - name: position_mae
    unit: "synthetic grid units"
    direction: lower
    threshold:
      operator: "<="
      value: 0.05
  - name: elapsed_ms
    unit: "milliseconds with tracemalloc enabled"
    direction: lower
  - name: peak_python_bytes
    unit: "traced Python allocation bytes"
    direction: lower
