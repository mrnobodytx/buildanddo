# --- CGRF Header ------------------------------------------------
# File:        .gitlab-ci.yml
# Stage:       11_COMMIT
# SRS:         SRS-BUILDANDDO-UPGRADE-001
# CAPS:        pending
# CK:          pending
# Dispatch:    VCC-BUILDANDDO-UPGRADE-001
# Seat:        BITS-CODEGEN
# Owner:       Citadel Nexus Inc.
# Created:     2026-09-24
# Depends:     services/praxis_evidence/run_all_tests.py, .gitlab/ci/day21-submission.yml
# EnumType:    Workflow
# EnumEdges:   CONSUMES services/praxis_evidence/run_all_tests.py; CONSUMES .gitlab/ci/day21-submission.yml
# Intent:      Keep GitLab testing blocking while isolating mutating Praxis suites from shared backends and production credentials.
# ----------------------------------------------------------------
# Private CI for the buildanddo GitLab intake mirror (gitlab.citadel-nexus.com/root/buildanddo).
# GitHub (mrnobodytx/buildanddo) is the public collaboration/submission plane; this project
# runs the private release pipeline on a dedicated shell runner (tag: buildanddo).
stages:
  - verify
  - test

integrity_gate:
  stage: verify
  tags:
    - buildanddo
  script:
    # npm workspaces: the lockfile is at the repo root (apps/*), not inside apps/web -
    # `npm ci --prefix apps/web` fails EUSAGE looking for a lockfile that isn't there.
    - npm ci
    - python3 scripts/ci/integrity_regression_check.py
    - python3 scripts/ci/verify_public_boundary.py --root .
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH =~ /^sprint\//'

# Day 21 of the campaign. sprint_cycle.py scores a milestone on whether a non-empty string
# was typed into its evidence field and nothing ever reads that string again - measured
# 2026-09-20, the real ledger and a ledger of eleven "x" characters both scored the same.
# This job re-checks each milestone against the claims its own evidence makes.
#
# It is NOT --strict. Rot on the public roadmap is something a person decides how to
# correct - by fixing the code or by re-recording the evidence - and a red pipeline on
# main would push people to do whichever is quicker rather than whichever is true. The
# selftest IS blocking, because a replay that cannot tell junk from evidence is worse than
# no replay at all. GIT_DEPTH gives the replay the history it needs to resolve cited
# commits; without it a shallow clone reports UNMEASURABLE for every one of them.
sprint_replay:
  stage: verify
  tags:
    - buildanddo
  variables:
    GIT_DEPTH: "0"
  script:
    - python3 scripts/ci/selftest_sprint_replay.py
    - python3 scripts/ci/sprint_replay.py
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH =~ /^sprint\//'

praxis_evidence_tests:
  stage: test
  tags:
    - buildanddo
  timeout: 30m
  parallel:
    matrix:
      - POCKETBASE_PROFILE: ["package", "compose"]
  # Each suite owns a fresh loopback database. Shared PB_API_URL, superuser
  # credentials, proxies and deployment files are never passed to test children.
  # Provisioning reuses the existing disposable-binary helper, not a deployed host.
  script:
    - python3 services/praxis_evidence/run_all_tests.py --profile $POCKETBASE_PROFILE --provision
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "external_pull_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH =~ /^sprint\//'

# BEGIN CITADEL BUILDANDDO VERIFIED RELEASE v1
# GitLab runner builds and packages the exact candidate after all existing
# pipeline gates pass. Remote staging/production mutation is deliberately NOT
# performed by the runner: the local/Rig1 release controller downloads this
# immutable artifact, deploys it, performs external /_version readback, and only
# then emits DORA. # verify-production
buildanddo_release_candidate:
  stage: .post
  rules:
    - if: '$BUILDANDDO_RELEASE_ENABLE == "1"'
      when: on_success
    - when: never
  script:
    - python3 tools/buildanddo_release.py plan --root . --repo .
    - python3 tools/buildanddo_release.py build --root . --repo .
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - .citadel-release/
# END CITADEL BUILDANDDO VERIFIED RELEASE v1

# BEGIN CITADEL DAY21 SUBMISSION CLOSURE v1
include:
  - local: '.gitlab/ci/day21-submission.yml'
# END CITADEL DAY21 SUBMISSION CLOSURE v1
