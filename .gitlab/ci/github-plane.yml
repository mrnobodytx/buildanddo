#              CONSUMES scripts/ci/emit_datadog_metrics.py; CONSUMES scripts/ci/supply_chain.py;
#              CONSUMES scripts/ci/lesson_keys.py; CONSUMES apps/web/tools/check-public-lessons.mjs;
#              PRODUCES CHANGELOG.md; PRODUCES .bits/growth.lock.json; PRODUCES scripts/ci/epoch_chain.json
# Intent:      Do in GitLab everything GitHub Actions used to do, so GitLab is the only CI.
# ───────────────────────────────────────────────────────────────

# GitHub is where people open and merge pull requests. Nothing runs there any more.
#
#   schedule (SCHEDULE_TASK=intake, every 10 min) on buildanddo-source
#     github_intake  merges actor:agent PRs GitLab passed (AUTOMERGE=1)
#     github_intake  GitHub main      -> buildanddo-source  (protected; same-SHA verified)
#                    trusted PR heads -> review/pr-N        (no secrets reach these)
#                    GitLab results   -> GitHub commit status "gitlab-ci/buildanddo"
#   push to buildanddo-source  every existing gate, plus evidence_epoch, main_writeback, ci_report
#   push to review/pr-N        every existing gate, plus ci_report
#
# Secret-bearing jobs run only on protected refs. Mark GITLAB_INGEST_TOKEN,
# GITHUB_STATUS_TOKEN and GITHUB_WRITEBACK_TOKEN as protected and masked, and protect
# buildanddo-source. Review pipelines run code from pull requests and get none of them.
# Operator setup: .bits/handoffs/2026-10-27-C-ONE-gitlab-only-ci.md
#
# Lanes: the short plane jobs run on runners tagged buildanddo-plane, so they never queue
# behind 30-minute acceptance jobs; everything else needs a runner tagged buildanddo.

github_intake:
  stage: verify
  tags: [buildanddo-plane]
  timeout: 15m
  resource_group: buildanddo-github-intake
  variables:
    GIT_DEPTH: "0"
    AUTOMERGE: "1"
  script:
    - python3 scripts/ci/gitlab_plane.py intake
    - python3 scripts/ci/gitlab_plane.py status
    # Merges actor:agent PRs on bits/SRS-* branches whose exact head GitLab passed.
    # Kill switch: set the project CI/CD variable AUTOMERGE to 0.
    - python3 scripts/ci/gitlab_plane.py automerge
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - state/ci/intake.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TASK == "intake" && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never

# Hourly. Datadog stays a no-op without DD_API_KEY; missing state is a clean SKIP.
stack_telemetry:
  stage: verify
  tags: [buildanddo-plane]
  timeout: 5m
  script:
    - python3 scripts/ci/emit_datadog_metrics.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TASK == "telemetry"'
    - when: never

# Weekly. Finds newly disclosed advisories without waiting for a code change.
supply_chain_weekly:
  stage: verify
  tags: [buildanddo]
  timeout: 10m
  script:
    - python3 scripts/ci/supply_chain.py
    - python3 scripts/ci/gitlab_plane.py ci-report --pipeline main --skip-static-analysis --skip-provenance
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/supply-chain.json
      - reports/telemetry/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TASK == "supply_chain"'
    - when: never

# The epoch chain is a chain, so epochs are built one at a time (shared resource group).
# The build is repeated here on purpose: a root over a tree this job built from the
# commit it describes is a stronger claim than a root over a sibling job's upload.
evidence_epoch:
  stage: test
  tags: [buildanddo]
  needs: []
  timeout: 30m
  resource_group: buildanddo-main-writeback
  variables:
    GIT_DEPTH: "0"
    # evidence_epoch.py reads the GitHub Actions names; they describe this GitLab run.
    GITHUB_SHA: "$CI_COMMIT_SHA"
    GITHUB_REF_NAME: "main"
    GITHUB_REPOSITORY: "mrnobodytx/buildanddo"
    GITHUB_WORKFLOW: "gitlab:evidence_epoch"
    GITHUB_RUN_ID: "$CI_PIPELINE_ID"
    GITHUB_RUN_ATTEMPT: "1"
    GITHUB_ACTOR: "$GITLAB_USER_LOGIN"
    GITHUB_OUTPUT: "state/epochs/outputs.env"
  script:
    - python3 scripts/ci/verify_public_boundary.py
    - npm ci
    - npm run build
    - python3 scripts/ci/gitlab_plane.py fetch-chain
    - python3 scripts/ci/evidence_epoch.py --chain state/epochs/chain-head.json --trigger merge
    # A root that does not recompute from its own manifest is never published.
    - python3 scripts/ci/evidence_epoch.py --verify state/epochs/latest.json --recheck-files
    - touch state/epochs/rechecked
    - python3 scripts/ci/gitlab_plane.py epoch-publish
  artifacts:
    when: always
    # Longer than candidate retention: the manifest is the only copy of the artifact
    # list the root was computed over, and its purpose is to outlive the artifacts.
    expire_in: 90 days
    paths:
      - state/epochs/
  rules:
    - if: '($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") && $CI_COMMIT_BRANCH == "buildanddo-source"'
    - when: never

# Commits the changelog, the chain head and the growth point to GitHub main, each as
# its own [skip ci] commit, and retries when main moves. It runs even when the epoch
# failed: the chain head is only written back from a self-verified epoch, and the
# changelog and growth point do not depend on it.
main_writeback:
  stage: .post
  tags: [buildanddo-plane]
  timeout: 15m
  resource_group: buildanddo-main-writeback
  needs:
    - job: evidence_epoch
      artifacts: true
  variables:
    GIT_DEPTH: "0"
  script:
    - python3 scripts/ci/gitlab_plane.py writeback
  rules:
    - if: '($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") && $CI_COMMIT_BRANCH == "buildanddo-source" && $CI_COMMIT_REF_PROTECTED == "true"'
      when: always
    - when: never

# Telemetry must never turn a pipeline red, so this is optional and runs even when
# acceptance fails. The main baseline is the last buildanddo-source ci_report artifact.
ci_report:
  stage: .post
  interruptible: true
  tags: [buildanddo]
  timeout: 15m
  allow_failure: true
  needs:
    - job: day21_full_acceptance
      artifacts: true
      optional: true
  script:
    - npm ci
    - npm run build
    - python3 scripts/ci/gitlab_plane.py ci-report
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/telemetry/
      - reports/supply-chain.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "buildanddo-source" || $CI_COMMIT_BRANCH =~ /^review\//'
      when: always
    - when: never

# SRS-BUILDANDDO-CURRICULUM-PRIVATE-001: the keyed lane, which restores the lesson
# explanation fingerprint scan on main. It is off unless the project CI/CD variable
# BUILDANDDO_LESSON_KEYS_ENABLED is 1, and even then it runs only for push or web
# pipelines on protected buildanddo-source, never on review/pr-N.
#   lesson_keys_bundle   builds the site with no keys and keeps dist/apps/web/ for a day.
#   lesson_keys_private  reads the private lesson key file from the File variable
#                        BUILDANDDO_LESSON_KEYS (protected, scoped to the lesson-keys
#                        environment) on a runner that takes protected refs only. It runs
#                        no npm, uses no cache and keeps no artifacts: the stdlib verifier
#                        runs under python3 -I and the scan imports only node built-ins.
#                        Without the variable the job stops BLOCKED (exit 3), which is
#                        allowed to fail; binding drift or a leak fails the pipeline.
# Setting the switch also makes automerge leave every PR that touches the keyed CI surface
# to a person (scripts/ci/gitlab_plane.py). Operator setup: handoff H11 of that SRS.
lesson_keys_bundle:
  stage: verify
  tags: [buildanddo]
  needs: []
  timeout: 30m
  script:
    - npm ci
    - npm run build
  artifacts:
    expire_in: 1 day
    paths:
      - dist/apps/web/
  rules:
    - if: '($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") && $CI_COMMIT_BRANCH == "buildanddo-source" && $CI_COMMIT_REF_PROTECTED == "true" && $BUILDANDDO_LESSON_KEYS_ENABLED == "1"'
    - when: never

lesson_keys_private:
  stage: test
  tags: [buildanddo-protected]
  timeout: 10m
  needs:
    - job: lesson_keys_bundle
      artifacts: true
  environment:
    name: lesson-keys
    action: prepare
  cache: []
  allow_failure: {exit_codes: [3]}
  script:
    - python3 -I scripts/ci/lesson_keys.py verify --keys "$BUILDANDDO_LESSON_KEYS" --require-private
    - node apps/web/tools/check-public-lessons.mjs dist/apps/web --keys "$BUILDANDDO_LESSON_KEYS" --require-keys
  rules:
    - if: '($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") && $CI_COMMIT_BRANCH == "buildanddo-source" && $CI_COMMIT_REF_PROTECTED == "true" && $BUILDANDDO_LESSON_KEYS_ENABLED == "1"'
    - when: never
