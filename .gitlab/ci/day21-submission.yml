# EnumType:    Workflow
# EnumEdges:   CONSUMES tools/day21/day21_acceptance.py; CONSUMES scripts/ci/day21_submission.py; CONSUMES scripts/ci/hostinger_readiness.py; CONSUMES scripts/ci/submission_readiness.py; CONSUMES scripts/ci/verify_public_boundary.py; CONSUMES .gitlab/ci/source-validation.yml
# Intent:      Execute and retain one complete candidate-bound acceptance matrix on the GitLab shell runner before submission evidence review.
# ───────────────────────────────────────────────────────────────

# Included by the existing GitLab root. These jobs run disposable tests and
# compile supplied evidence; they do not activate providers or deploy services.
include:
  - local: '.gitlab/ci/source-validation.yml'

day21_governance:
  stage: verify
  tags: [buildanddo]
  script:
    - python3 scripts/ci/hostinger_readiness.py --check
    - python3 scripts/ci/submission_readiness.py --check
    - python3 scripts/ci/verify_public_boundary.py --gitlab-ci
    - python3 scripts/ci/agent_context.py --check
    - python3 -m unittest tests.upgrade.test_public_boundary tests.upgrade.test_gitlab_acceptance tests.upgrade.test_hostinger_readiness tests.upgrade.test_hostinger_replay tests.upgrade.test_submission_readiness tests.upgrade.test_day21_acceptance tests.upgrade.test_day21_submission
    - python3 tests/upgrade/check_sprint_execution.py
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - .buildanddo/public/boundary-report.json
      - reports/junit/sprint-execution.xml
      - reports/coverage/sprint-execution.json
  rules:
    - if: '$DAY21_FULL_ACCEPTANCE == "1" || $DAY21_COMPILE_SUBMISSION == "1"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "external_pull_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH =~ /^sprint\//'
    - when: never

# Run all eight source/build checks and five native checks for EACH declared
# PocketBase version. A partial selection cannot satisfy full acceptance.
# The runner installs npm from the root lock and Python requirements into an
# isolated interpreter, then provisions the declared disposable binaries.
day21_full_acceptance:
  stage: test
  tags: [buildanddo]
  before_script:
    - node --eval "require('node:assert/strict').equal(process.versions.node.split('.')[0], require('node:fs').readFileSync('.nvmrc', 'utf8').trim())"
    - python3 -m venv state/day21/venv
  script:
    - state/day21/venv/bin/python tools/day21/day21_acceptance.py --repo . --install-deps --evidence-dir reports/day21/acceptance --summary-output state/day21/evidence/acceptance-summary.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/day21/
      - reports/junit/
      - reports/coverage/
      # Receipt validation also compares the original repository artifact paths.
      - dist/apps/web/index.html
      # Includes summary, receipts, logs AND all referenced artifact bytes.
      - state/day21/evidence/
  rules:
    - if: '$DAY21_FULL_ACCEPTANCE == "1" || $DAY21_COMPILE_SUBMISSION == "1"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "external_pull_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH =~ /^sprint\//'
    - when: never

# The receiving owner must also supply candidate-matched deployment, browser,
# product and replay captures. Acceptance alone cannot create those proofs.
day21_submission_bundle:
  stage: .post
  tags: [buildanddo]
  needs:
    - job: day21_full_acceptance
      artifacts: true
    - job: day21_governance
      artifacts: false
    - job: source_discord
      artifacts: false
    - job: source_foundry
      artifacts: false
    - job: source_federal_portfolio
      artifacts: false
    - job: source_mission_suite
      artifacts: false
    - job: source_behavior_coverage
      artifacts: false
    - job: source_assurance
      artifacts: false
  script:
    - python3 scripts/ci/day21_submission.py bundle --root . --evidence state/day21/evidence --output state/day21/submission
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - state/day21/submission/
  rules:
    - if: '$DAY21_COMPILE_SUBMISSION == "1"'
      when: manual
      allow_failure: false
    - when: never
