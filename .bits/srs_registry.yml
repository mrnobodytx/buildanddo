# EnumType:    ConfigDoc
# EnumEdges:   GATES bits/SRS-* branches; VALIDATES .bits/srs
# Intent:      Name every SRS code a branch may claim, and where its spec lives.
# ───────────────────────────────────────────────────────────────
#
# Format is a deliberately small YAML subset so scripts/ci/agent_context.py can
# read it without a third-party parser: a single top-level `srs:` key holding a
# list of flat mappings. One `- code:` line starts an entry; following indented
# `key: value` lines belong to it. No nesting, no anchors, no multi-line values.
#
# status: proposed | ready | in_progress | delivered | withdrawn
#   proposed     written down, not authorised - needs a dispatch before work starts
#   ready        authorised, unstarted
#   in_progress  a branch is claiming this code right now
#   delivered    merged to main and verified
# risk:   A0 | A1 | A2 | A3  (A3+ needs explicit human approval before work starts)
#
# An entry with a `spec:` path must have that file. A spec file under .bits/srs/
# with no entry here is a governance failure - agent_context.py reports both.

