file: apps/web/public/manifest.webmanifest
linked_from: apps/web/index.html (link rel="manifest")
start_url: /app
theme_color: "#F4F2EB"
background_color: "#F4F2EB"
color_source: brand token "paper", the app's light background
icons:
  - src: /icon-192.png
    purpose: any
  - src: /icon-512.png
    purpose: any
  - src: /icon-512.png
    purpose: maskable
maskable_measurement: >-
  Measured 2026-09-22 on icon-512.png: the red background reaches all four
  corners, and the pulse line (anti-aliasing included) ends 170.8 px from the
  centre, 33.4% of the width. The maskable safe zone is a centred circle of
  radius 40%, so no launcher mask can cut into the mark.
