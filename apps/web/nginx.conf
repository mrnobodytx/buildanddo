# Depends:     apps/web/Dockerfile, apps/pocketbase/Dockerfile
# EnumType:    ConfigDoc
# EnumEdges:   CONSUMES apps/web/Dockerfile; PRODUCES /api/health; EXTENDS apps/pocketbase/Dockerfile
# DAG Node:    buildanddo.staging.proxy
# Intent:      Serve the production SPA and keep browser-to-PocketBase traffic on the staging origin.
# ───────────────────────────────────────────────────────────

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    client_max_body_size 32m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location /api/ {
            proxy_pass http://pocketbase:8090;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 65s;
        }

        # Keep the PocketBase administration route behind the same staging
        # ingress. Authentication and authorization remain PocketBase-owned.
        location /_/ {
            proxy_pass http://pocketbase:8090;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
