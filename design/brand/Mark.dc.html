<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BuildAndDo mark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{size}}px; height: {{size}}px">
<svg viewBox="0 0 64 64" width="100%" height="100%" role="img" aria-label="BuildAndDo mark">
<g stroke="{{line}}" style="stroke-width: {{weight}}px; stroke-linejoin: round">
<polygon points="44,20 54,10 54,44 44,54" fill="hsl(38, 60%, 64%)"></polygon>
<polygon points="10,20 20,10 54,10 44,20" fill="hsl(0, 70%, 40%)"></polygon>
<rect x="10" y="20" width="34" height="34" fill="hsl(40, 18%, 97%)"></rect>
<g display="{{ticks}}" stroke="hsl(220, 16%, 12%)" style="stroke-width: 2px">
<line x1="10" y1="28" x2="17" y2="28"></line>
<line x1="10" y1="35" x2="14" y2="35"></line>
<line x1="10" y1="42" x2="17" y2="42"></line>
<line x1="10" y1="49" x2="14" y2="49"></line>
</g>
</g>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"size":{"editor":"int","default":64,"min":16,"max":512,"unit":"px"},"dark":{"editor":"boolean","default":false},"$preview":{"width":64,"height":64}}'>
class Component extends DCLogic {
  renderVals() {
    var size = Number(this.props.size) || 64;
    var dark = this.props.dark === true || this.props.dark === 'true';
    return {
      size: size,
      line: dark ? 'hsl(42, 22%, 90%)' : 'hsl(220, 16%, 12%)',
      weight: size < 32 ? 4 : 3,
      ticks: size >= 32 ? 'inline' : 'none'
    };
  }
}
</script>
</body>
</html>
