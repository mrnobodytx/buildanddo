<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Buddi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{w}}px; height: {{h}}px; color: {{line}}">
<svg viewBox="0 0 220 240" width="100%" height="100%" role="img" aria-label="{{label}}">
<g stroke="{{line}}" fill="none" style="stroke-width: 4px; stroke-linejoin: round; stroke-linecap: round">
<line display="{{showGround}}" x1="26" y1="226" x2="194" y2="226" stroke="{{rule}}" style="stroke-width: 2px"></line>
<rect x="70" y="196" width="14" height="28" fill="{{line}}"></rect>
<rect x="116" y="196" width="14" height="28" fill="{{line}}"></rect>
<g display="{{leftDown}}">
<path d="M44 136 L24 170"></path>
<circle cx="22" cy="174" r="7" fill="{{line}}"></circle>
</g>
<g display="{{rightDown}}">
<path d="M176 128 L194 164"></path>
<circle cx="196" cy="168" r="7" fill="{{line}}"></circle>
</g>
<g display="{{hello}}">
<path d="M176 122 Q198 108 196 82"></path>
<circle cx="196" cy="76" r="7" fill="{{line}}"></circle>
<path d="M207 64 L214 56" style="stroke-width: 3px"></path>
<path d="M209 80 L217 79" style="stroke-width: 3px"></path>
</g>
<path display="{{think}}" d="M44 150 Q24 186 56 184"></path>
<path display="{{verified}}" d="M176 120 L192 98"></path>
<g display="{{build}}">
<path d="M44 112 L54 54"></path>
<path d="M176 102 L166 54"></path>
</g>
<polygon points="160,80 178,62 178,182 160,200" fill="{{side}}"></polygon>
<polygon points="40,80 58,62 178,62 160,80" fill="{{cap}}"></polygon>
<rect x="40" y="80" width="120" height="120" fill="{{body}}"></rect>
<g stroke="{{feature}}" style="stroke-width: 3px; stroke-linecap: butt">
<line x1="40" y1="100" x2="52" y2="100"></line>
<line x1="40" y1="120" x2="47" y2="120"></line>
<line x1="40" y1="140" x2="52" y2="140"></line>
<line x1="40" y1="160" x2="47" y2="160"></line>
<line x1="40" y1="180" x2="52" y2="180"></line>
</g>
<circle cx="68" cy="148" r="6" fill="{{cap}}" stroke="none" opacity="0.3"></circle>
<circle cx="134" cy="148" r="6" fill="{{cap}}" stroke="none" opacity="0.3"></circle>
<g display="{{dots}}" stroke="none">
<circle cx="{{eyeLx}}" cy="{{eyeY}}" r="7" fill="{{feature}}"></circle>
<circle cx="{{eyeRx}}" cy="{{eyeY}}" r="7" fill="{{feature}}"></circle>
<circle cx="{{hlLx}}" cy="{{hlY}}" r="2.2" fill="{{body}}"></circle>
<circle cx="{{hlRx}}" cy="{{hlY}}" r="2.2" fill="{{body}}"></circle>
</g>
<g display="{{arcs}}" stroke="{{feature}}">
<path d="M73 128 Q81 118 89 128"></path>
<path d="M113 128 Q121 118 129 128"></path>
</g>
<path d="{{mouth}}" stroke="{{feature}}" fill="{{mouthFill}}"></path>
<g display="{{flag}}">
<line x1="150" y1="62" x2="150" y2="24"></line>
<polygon points="150,24 176,32 150,40" fill="{{cap}}"></polygon>
</g>
<g display="{{think}}">
<circle cx="58" cy="183" r="7" fill="{{line}}"></circle>
<circle cx="192" cy="46" r="5" style="stroke-width: 3px"></circle>
<circle cx="204" cy="24" r="8" style="stroke-width: 3px"></circle>
</g>
<g display="{{verified}}">
<circle cx="196" cy="80" r="17" fill="{{green}}"></circle>
<path d="M188 80 L194 86 L205 73" stroke="{{paper}}"></path>
</g>
<g display="{{build}}">
<rect x="36" y="18" width="148" height="34" fill="{{plank}}"></rect>
<line x1="60" y1="35" x2="90" y2="35" stroke="{{feature}}" style="stroke-width: 2px" opacity="0.45"></line>
<line x1="120" y1="29" x2="160" y2="29" stroke="{{feature}}" style="stroke-width: 2px" opacity="0.45"></line>
<circle cx="54" cy="54" r="7" fill="{{line}}"></circle>
<circle cx="166" cy="54" r="7" fill="{{line}}"></circle>
</g>
</g>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"pose":{"editor":"enum","options":["calm","hello","think","verified","build"],"default":"hello"},"size":{"editor":"int","default":220,"min":16,"max":800,"unit":"px"},"dark":{"editor":"boolean","default":false},"ground":{"editor":"boolean","default":false},"$preview":{"width":220,"height":240}}'>
class Component extends DCLogic {
  renderVals() {
    var poses = ['calm', 'hello', 'think', 'verified', 'build'];
    var pose = poses.indexOf(this.props.pose) >= 0 ? this.props.pose : 'hello';
    var dark = this.props.dark === true || this.props.dark === 'true';
    var ground = this.props.ground === true || this.props.ground === 'true';
    var size = Number(this.props.size) || 220;
    var show = function (on) { return on ? 'inline' : 'none'; };
    var ink = 'hsl(220, 16%, 12%)';
    var up = pose === 'think';
    var eyeLx = up ? 84 : 81, eyeRx = up ? 124 : 121, eyeY = up ? 120 : 126;
    var mouths = {
      calm: 'M88 158 Q101 168 114 158',
      hello: 'M86 154 Q101 170 116 154',
      think: 'M91 162 L111 162',
      verified: 'M84 152 Q101 178 118 152 Z',
      build: 'M90 160 Q101 166 112 160'
    };
    var names = { calm: 'calm', hello: 'waving hello', think: 'thinking', verified: 'holding a verified check', build: 'building' };
    return {
      w: size,
      h: Math.round(size * 240 / 220),
      label: 'Buddi, the BuildAndDo mascot, ' + names[pose],
      line: dark ? 'hsl(42, 22%, 90%)' : ink,
      feature: ink,
      rule: dark ? 'hsl(220, 10%, 32%)' : 'hsl(220, 12%, 74%)',
      body: 'hsl(40, 18%, 97%)',
      cap: 'hsl(0, 70%, 40%)',
      side: 'hsl(38, 60%, 64%)',
      plank: 'hsl(38, 58%, 40%)',
      green: 'hsl(128, 26%, 34%)',
      paper: 'hsl(42, 30%, 95%)',
      showGround: show(ground),
      leftDown: show(pose !== 'think' && pose !== 'build'),
      rightDown: show(pose === 'calm' || pose === 'think'),
      hello: show(pose === 'hello'),
      think: show(pose === 'think'),
      verified: show(pose === 'verified'),
      build: show(pose === 'build'),
      flag: show(pose !== 'build'),
      dots: show(pose !== 'verified'),
      arcs: show(pose === 'verified'),
      eyeLx: eyeLx, eyeRx: eyeRx, eyeY: eyeY,
      hlLx: eyeLx + 2, hlRx: eyeRx + 2, hlY: eyeY - 3,
      mouth: mouths[pose],
      mouthFill: pose === 'verified' ? ink : 'none'
    };
  }
}
</script>
</body>
</html>
