# EnumType:    Workflow
# EnumEdges:   CONSUMES workflow_run.BuildAndDo Candidate to GitLab; PRODUCES datadog.dora.deployment
# Intent:      Emit a DORA deployment event only when a main-branch candidate pipeline actually succeeds.
# ───────────────────────────────────────────────────────────────

name: Datadog DORA Deployment

on:
  workflow_run:
    workflows: ["BuildAndDo Candidate to GitLab"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: buildanddo-dora-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  deployment:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Send DORA deployment event
        shell: bash
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_SITE: ${{ secrets.DD_SITE || 'us5.datadoghq.com' }}
          DD_BETA_COMMANDS_ENABLED: '1'
          STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
          FINISHED_AT: ${{ github.event.workflow_run.updated_at }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY_URL: ${{ github.event.repository.html_url }}
        run: |
          set -euo pipefail

          if [ -z "${DD_API_KEY}" ]; then
            echo "SKIP: DD_API_KEY is not configured; no DORA deployment event sent."
            exit 0
          fi

          npx --yes @datadog/datadog-ci@^2 dora deployment \
            --service buildanddo-web \
            --env production \
            --started-at "${STARTED_AT}" \
            --finished-at "${FINISHED_AT}" \
            --git-repository-url "${REPOSITORY_URL}" \
            --git-commit-sha "${COMMIT_SHA}"
