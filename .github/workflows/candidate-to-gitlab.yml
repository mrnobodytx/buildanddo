name: BuildAndDo Candidate to GitLab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: buildanddo-main-candidate
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GITLAB_REPO_URL: ${{ secrets.GITLAB_INGEST_REPO_URL }}
      GITLAB_INGEST_USER: ${{ secrets.GITLAB_INGEST_USER }}
      GITLAB_INGEST_TOKEN: ${{ secrets.GITLAB_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Public boundary
        run: python scripts/ci/verify_public_boundary.py

      - name: Install, test, build
        run: |
          python scripts/ci/supply_chain.py --skip-audit --check-lock
          npm ci
          npm run lint --if-present
          npm test --if-present
          npm run build
          test -d dist/apps/web
          test -f dist/apps/web/index.html

      - name: Report to Datadog CI Visibility
        if: always()
        uses: ./.github/actions/datadog-ci-report
        with:
          dd-api-key: ${{ secrets.DD_API_KEY }}
          dd-site: ${{ secrets.DD_SITE || 'us5.datadoghq.com' }}
          service: buildanddo-web
          env: ci
          pipeline: main
          base-ref: HEAD~1
          baseline-artifact: buildanddo-telemetry-main
          artifact-name: buildanddo-telemetry-main
          job-status: ${{ job.status }}
          github-token: ${{ github.token }}

      - name: Generate candidate provenance
        run: python scripts/ci/candidate_manifest.py

      - name: Upload GitHub candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: buildanddo-candidate-${{ github.sha }}
          path: |
            BUILDANDDO_CANDIDATE_PROVENANCE.json
            .buildanddo/public/boundary-report.json
            dist/apps/web
          retention-days: 30

      - name: Mirror candidate to private GitLab intake
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GITLAB_REPO_URL:-}" ] || [ -z "${GITLAB_INGEST_USER:-}" ] || [ -z "${GITLAB_INGEST_TOKEN:-}" ]; then
            echo "HOLD: GitLab ingest secrets are not configured."
            exit 1
          fi

          # SAME-SHA INVARIANT.
          # Provenance describes the candidate; it must never become a new candidate.
          # The previous revision committed BUILDANDDO_CANDIDATE_PROVENANCE.json here,
          # which moved HEAD and propagated a DIFFERENT commit to GitLab than
          # ${GITHUB_SHA}. That file is already uploaded as a workflow artifact above,
          # so the commit was redundant as well as unsound. Evidence is transported as
          # evidence, never as history.
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$ACTUAL" != "$GITHUB_SHA" ]; then
            echo "HOLD: candidate SHA mutated expected=$GITHUB_SHA actual=$ACTUAL"
            exit 1
          fi

          cat > "$RUNNER_TEMP/git-askpass.sh" <<'EOF'
          #!/usr/bin/env sh
          case "$1" in
            *Username*) printf '%s\n' "$GITLAB_INGEST_USER" ;;
            *Password*) printf '%s\n' "$GITLAB_INGEST_TOKEN" ;;
            *) printf '\n' ;;
          esac
          EOF
          chmod 700 "$RUNNER_TEMP/git-askpass.sh"
          export GIT_ASKPASS="$RUNNER_TEMP/git-askpass.sh"
          export GIT_TERMINAL_PROMPT=0

          git remote remove gitlab-intake 2>/dev/null || true
          git remote add gitlab-intake "$GITLAB_REPO_URL"
          # Push the exact candidate object rather than HEAD, so that if anything ever
          # moves HEAD again the guard above fails the job instead of silently
          # shipping a different lineage to GitLab.
          git push --force-with-lease gitlab-intake "${GITHUB_SHA}:refs/heads/buildanddo-source"

      - name: Verify GitLab received the EXACT candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          # A successful push does not prove propagation. Ask GitLab whether the commit
          # object exists, by SHA. A 200 here IS the same-SHA invariant; anything else
          # holds the release at this boundary rather than downstream.
          API="${GITLAB_API_URL:-https://gitlab.citadel-nexus.com/api/v4}"
          PROJ="${GITLAB_PROJECT_ID:-104}"
          CODE="$(curl -sS -o /tmp/glcommit.json -w "%{http_code}" \
            -H "PRIVATE-TOKEN: ${GITLAB_INGEST_TOKEN}" \
            "${API}/projects/${PROJ}/repository/commits/${GITHUB_SHA}")"
          if [ "$CODE" != "200" ]; then
            echo "HOLD: GitLab has no commit object ${GITHUB_SHA} (http=${CODE})"
            exit 1
          fi
          echo "PROPAGATION VERIFIED: GitLab holds ${GITHUB_SHA}"
