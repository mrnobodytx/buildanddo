name: BuildAndDo PR Governance

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: buildanddo-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  readiness:
    name: governance:readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require reviewed milestone rationale, ownership and next steps
        run: python scripts/ci/hostinger_readiness.py --check
      - name: Require internal submission standards and explicitly unknown official rules
        run: python scripts/ci/submission_readiness.py --check
      - name: Require evidence integrity and replay rejection cases
        run: python -m unittest tests.upgrade.test_hostinger_readiness tests.upgrade.test_hostinger_replay tests.upgrade.test_submission_readiness
      - name: Require bounded worker and submission source coverage
        run: python tests/upgrade/check_sprint_execution.py
      - name: Retain worker and submission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint-execution-${{ github.event.pull_request.number }}
          path: |
            reports/coverage/sprint-execution.json
            reports/junit/sprint-execution.xml
          if-no-files-found: error
          retention-days: 14

  govern:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require current sprint governance before acceptance
        run: python scripts/ci/hostinger_readiness.py --check

      - name: Enforce public/private boundary and contributor visibility
        run: python scripts/ci/verify_public_boundary.py --github-event "$GITHUB_EVENT_PATH"

      - name: Verify agent context lock is current
        run: python scripts/ci/agent_context.py --check

      # Verify-only while the changelog is new: a stale changelog is worth
      # reporting, not worth failing a build over until every contributor has
      # the regeneration step in muscle memory.
      - name: Verify changelog matches main history
        continue-on-error: true
        run: python scripts/ci/changelog_gen.py --check

      - name: Verify dependency lock matches every manifest
        run: python scripts/ci/hostinger_readiness.py --run dependency_lock --evidence-dir reports/hostinger

      - name: Install
        run: npm ci

      - name: Install declared source-test dependencies
        run: python -m pip install -r scripts/discordbot/requirements.txt -r apps/research/requirements.txt

      - name: Require frontend lint
        run: python scripts/ci/hostinger_readiness.py --run web_lint --evidence-dir reports/hostinger

      # Required, not `--if-present`: a missing test script must fail the PR
      # rather than pass silently, which is what the old no-op step did.
      - name: Test with coverage
        run: python scripts/ci/hostinger_readiness.py --run web_tests --evidence-dir reports/hostinger

      # The suite can pass while producing no report (wrong reporter, wrong
      # path), which would leave Datadog test visibility empty and green.
      - name: Verify JUnit test report was produced
        run: test -s reports/junit/web.xml

      - name: Verify public JavaScript contracts with retained counts
        run: python scripts/ci/hostinger_readiness.py --run source_node --evidence-dir reports/hostinger

      - name: Verify public Python contracts without counting native skips as acceptance
        run: python scripts/ci/hostinger_readiness.py --run source_python --evidence-dir reports/hostinger

      - name: Capture semantic twin acceptance
        run: python scripts/ci/hostinger_readiness.py --run semantic_twin --evidence-dir reports/hostinger

      - name: Capture source boundary acceptance
        run: python scripts/ci/hostinger_readiness.py --run boundary --evidence-dir reports/hostinger

      - name: Build
        run: python scripts/ci/hostinger_readiness.py --run web_build --evidence-dir reports/hostinger

      - name: Verify expected web artifact
        run: test -d dist/apps/web && test -f dist/apps/web/index.html

      - name: Report to Datadog CI Visibility
        if: always()
        uses: ./.github/actions/datadog-ci-report
        with:
          dd-api-key: ${{ secrets.DD_API_KEY }}
          dd-site: ${{ secrets.DD_SITE || 'us5.datadoghq.com' }}
          service: buildanddo-web
          env: ci
          pipeline: pr
          base-ref: origin/${{ github.base_ref }}
          baseline-artifact: buildanddo-telemetry-main
          artifact-name: buildanddo-telemetry-pr-${{ github.event.pull_request.number }}
          job-status: ${{ job.status }}
          github-token: ${{ github.token }}

      - name: Upload governance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-governance-${{ github.event.pull_request.number }}
          path: |
            .buildanddo/public/boundary-report.json
            reports/junit
            reports/coverage
            reports/hostinger
            reports/supply-chain.json
            dist/apps/web
          retention-days: 14

  foundry:
    name: ci:test / Federal foundry (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install foundry parser and source-check tools
        run: python -m pip install -r foundry/shared/requirements.txt mypy==1.13.0 ruff==0.14.8
      - name: Require real trials, negative cases and per-module source coverage
        run: python tests/foundry/check_foundry.py
      - name: Check typed foundry source
        run: python -m mypy --strict --follow-imports=silent foundry/shared/federal_foundry
      - name: Check Python style
        run: python -m ruff check foundry/shared/federal_foundry tests/foundry
      - name: Check Python formatting
        run: python -m ruff format --check foundry/shared/federal_foundry tests/foundry
      - name: Execute all five reference lanes
        run: python -m foundry.shared.federal_foundry run --all --output "$RUNNER_TEMP/foundry-runs"
      - name: Verify every campaign input and outcome
        run: python -m foundry.shared.federal_foundry verify "$RUNNER_TEMP/foundry-runs"
      - name: Compile the observed review portfolio
        run: python -m foundry.shared.federal_foundry compile --runs "$RUNNER_TEMP/foundry-runs" --output "$RUNNER_TEMP/foundry-review" --archive "$RUNNER_TEMP/foundry-review.zip"
      - name: Verify the self-contained export
        run: python -m foundry.shared.federal_foundry verify "$RUNNER_TEMP/foundry-review"
      - name: Retain measured reports, technical briefs, slides and receipts
        uses: actions/upload-artifact@v4
        with:
          name: federal-foundry-review-python-${{ matrix.python }}
          path: ${{ runner.temp }}/foundry-review.zip
          if-no-files-found: error
          retention-days: 14

  discord:
    name: ci:test / Discord SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install declared Discord and document runtimes for source tests
        run: python -m pip install -r scripts/discordbot/requirements.txt -r apps/research/requirements.txt

      - name: Require native commands, document parsing and research source coverage
        run: python tests/upgrade/check_discordbot.py --include-research --require-sdk --require-pdf

      - name: Require native CPU blueprint-to-session pipeline and source coverage
        run: python tests/upgrade/check_blueprint_pipeline.py --require-pdf

  dossier-native:
    name: ci:test / PocketBase dossier and suite (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runtime: [compose, package]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve the repository's declared PocketBase runtime
        env:
          DOSSIER_TEST_RUNTIME: ${{ matrix.runtime }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          if os.environ['DOSSIER_TEST_RUNTIME'] == 'package':
              version = Path('apps/pocketbase/.pocketbase-version').read_text().strip()
          else:
              version = re.search(r'POCKETBASE_VERSION:-([0-9.]+)', Path('docker-compose.yml').read_text()).group(1)
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit('Invalid declared PocketBase test version')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('DOSSIER_TEST_PB_VERSION=' + version + '\n')
          PY

      - name: Build the existing local runtime image for validation
        run: docker build --build-arg "POCKETBASE_VERSION=$DOSSIER_TEST_PB_VERSION" --tag buildanddo-dossier-native apps/pocketbase

      - name: Extract the test binary without starting the packaged services
        run: |
          dossier_test_container=$(docker create buildanddo-dossier-native)
          trap 'docker rm "$dossier_test_container" >/dev/null' EXIT
          docker cp "$dossier_test_container:/pb/pocketbase" "$RUNNER_TEMP/dossier-pocketbase"
          chmod +x "$RUNNER_TEMP/dossier-pocketbase"

      - name: Require native auth, OAuth model lookup, encryption and concurrent retries
        env:
          BUILDANDDO_TEST_POCKETBASE: ${{ runner.temp }}/dossier-pocketbase
        run: python scripts/ci/hostinger_readiness.py --run native_dossier --runtime ${{ matrix.runtime }} --evidence-dir reports/hostinger

      - name: Require native suite leases, operator visibility, read-only snapshots and rollback
        env:
          BUILDANDDO_TEST_POCKETBASE: ${{ runner.temp }}/dossier-pocketbase
        run: python scripts/ci/hostinger_readiness.py --run native_suite --runtime ${{ matrix.runtime }} --evidence-dir reports/hostinger

      - name: Require native classroom auth, attendance, retries and rollback
        env:
          BUILDANDDO_TEST_POCKETBASE: ${{ runner.temp }}/dossier-pocketbase
        run: python scripts/ci/hostinger_readiness.py --run native_classroom --runtime ${{ matrix.runtime }} --evidence-dir reports/hostinger

      - name: Require native tutorial checkpoints, certificates, concurrent credit and retention
        env:
          BUILDANDDO_TEST_POCKETBASE: ${{ runner.temp }}/dossier-pocketbase
        run: python scripts/ci/hostinger_readiness.py --run native_learning --runtime ${{ matrix.runtime }} --evidence-dir reports/hostinger

      - name: Require connected workspace auth, signal proposals, separate review and persistence
        env:
          BUILDANDDO_TEST_POCKETBASE: ${{ runner.temp }}/dossier-pocketbase
        run: python scripts/ci/hostinger_readiness.py --run native_workspace --runtime ${{ matrix.runtime }} --evidence-dir reports/hostinger

      - name: Retain native acceptance results and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-native-${{ matrix.runtime }}
          path: reports/hostinger
          if-no-files-found: warn
          retention-days: 14

  federal-foundry:
    name: ci:test / Federal portfolio (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Require portfolio contracts, evidence checks, portability and coverage
        run: python tests/upgrade/check_federal_foundry.py
      - name: Compile the five model-independent Bits work packages
        run: python -m apps.federal_foundry compile --output "$RUNNER_TEMP/buildanddo-federal-portfolio"
      - name: Retain the prepared packets for existing Bits intake
        uses: actions/upload-artifact@v4
        with:
          name: buildanddo-federal-portfolio-python-${{ matrix.python }}
          path: ${{ runner.temp }}/buildanddo-federal-portfolio
          if-no-files-found: error
          retention-days: 14
      - name: Retain measured portfolio test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildanddo-federal-tests-python-${{ matrix.python }}
          path: |
            reports/junit/federal-foundry.xml
            reports/coverage/federal-foundry.json
          if-no-files-found: error
          retention-days: 14

  mission-suite:
    name: ci:test / Mission suite (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Require suite behavior, replay, package identity and source coverage
        run: python tests/upgrade/check_mission_suite.py
      - name: Verify suite API, client and government curriculum
        run: node --test tests/upgrade/suite-system.test.mjs tests/upgrade/suite-client.test.mjs tests/upgrade/government-learning.test.mjs
      - name: Package the verified source worker
        run: python -m apps.mission_suite package "$RUNNER_TEMP/buildanddo-mission-suite.tgz"
      - name: Retain the portable worker for operator review
        uses: actions/upload-artifact@v4
        with:
          name: buildanddo-mission-suite-python-${{ matrix.python }}
          path: ${{ runner.temp }}/buildanddo-mission-suite.tgz
          if-no-files-found: error
          retention-days: 14
